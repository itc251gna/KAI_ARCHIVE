<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κ.Α.Ι. - Προσωρινό Μπλοκάρισμα</title>
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            padding: 3rem;
            max-width: 450px;
            width: 90%;
        }

        .kai-logo {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            margin-bottom: 1.5rem;
        }

        .alert-custom {
            background-color: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <img src="{{ url_for('static', filename='kai_logo.jpg') }}" alt="KAI Logo" class="kai-logo">
        
        <h3 class="fw-bold text-danger mb-2">🛑 Πρόσβαση Απορρίφθηκε</h3>
        <p class="text-secondary mb-4 fw-medium">Το σύστημα ασφαλείας ενεργοποιήθηκε.</p>
        
        <div class="alert-custom">
            <strong>Αιτία:</strong> Υπερβολικός αριθμός προσπαθειών.<br>
            <small class="text-muted">({{ error_description }})</small>
        </div>
        
        <p class="text-dark small mb-4">
            Παρακαλώ περιμένετε 1 λεπτό πριν δοκιμάσετε να συνδεθείτε ξανά ή να κάνετε νέα αναζήτηση.
        </p>

        <a href="{{ url_for('login') }}" class="btn btn-dark w-100 btn-lg shadow-sm" style="border-radius: 10px;">
            Επιστροφή στην Αρχική
        </a>
    </div>

</body>
</html>
