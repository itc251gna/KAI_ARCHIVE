<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κ.Α.Ι. - Είσοδος Συστήματος</title>
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            position: relative;
            overflow-x: hidden; /* Αποτρέπει το scroll */
        }

        /* --- ΥΔΑΤΟΓΡΑΦΗΜΑ (ΔΕΞΙΑ & ΑΡΙΣΤΕΡΑ) --- */
        .watermark-side {
            position: fixed;
            top: 50%;
            width: 60vh; /* Ακόμα πιο μεγάλο για το login */
            height: 60vh;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0.06; 
            z-index: -1; 
            pointer-events: none; 
        }
        .watermark-left {
            left: -15vh;
            transform: translateY(-50%);
        }
        .watermark-right {
            right: -15vh;
            transform: translateY(-50%);
        }

        .kai-logo {
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border: 4px solid white;
            transition: transform 0.3s ease;
        }
        .kai-logo:hover {
            transform: scale(1.05);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
            border-color: #0d6efd;
        }
        .btn-primary {
            border-radius: 8px;
            font-weight: 600;
            background: linear-gradient(90deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 15px rgba(13, 110, 253, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <img src="{{ url_for('static', filename='kai_logo.jpg') }}" class="watermark-side watermark-left" alt="Background Left">
    <img src="{{ url_for('static', filename='kai_logo.jpg') }}" class="watermark-side watermark-right" alt="Background Right">

    <div class="card login-card" style="width: 420px;">
        <div class="card-body p-5">
            
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='kai_logo.jpg') }}" alt="KAI Logo" class="kai-logo" style="width: 130px; height: 130px;">
                <h4 class="mt-4 mb-1 fw-bold text-primary">Κ.Α.Ι.</h4>
                <p class="text-muted small fw-medium mb-0">Σύστημα Υγειονομικών Εξετάσεων</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show border-0 rounded-3 shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form action="/login" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold small text-uppercase">Όνομα Χρήστη</label>
                    <input type="text" name="username" class="form-control" required placeholder="π.χ. admin">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold small text-uppercase">Κωδικός Πρόσβασης</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg mt-2 shadow-sm">Είσοδος</button>
            </form>
        </div>
        <div class="card-footer bg-transparent border-0 text-center text-muted small pb-4 pt-0">
            &copy; 2026 Κέντρο Αεροπορικής Ιατρικής
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
