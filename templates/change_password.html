{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-secondary">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">🔑 Αλλαγή Κωδικού Πρόσβασης</h5>
            </div>
            <div class="card-body p-4">
                <form action="/change_password" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Τρέχων (Παλιός) Κωδικός</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary">Νέος Κωδικός</label>
                        <input type="password" name="new_password" class="form-control border-primary" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-primary">Επιβεβαίωση Νέου Κωδικού</label>
                        <input type="password" name="confirm_password" class="form-control border-primary" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 btn-lg mb-2">Αποθήκευση Αλλαγών</button>
                    <a href="/" class="btn btn-outline-dark w-100">Ακύρωση</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
