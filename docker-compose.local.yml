services:
  kai-db:
    image: postgres:15-alpine
    container_name: kai-vchatgpt-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "15432:5432"
    volumes:
      - ./runtime/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kai-redis:
    image: redis:alpine
    container_name: kai-vchatgpt-redis
    restart: unless-stopped

  kai-guacd:
    image: guacamole/guacd
    container_name: kai-vchatgpt-guacd
    restart: unless-stopped

  kai-guacamole:
    image: guacamole/guacamole
    container_name: kai-vchatgpt-guacamole
    environment:
      - GUACD_HOSTNAME=kai-vchatgpt-guacd
      - GUACD_PORT=4822
      - GUACAMOLE_HOME=/etc/guacamole
      - HTTP_AUTH_ENABLED=true
      - HTTP_AUTH_HEADER=X-Guacamole-User
      - POSTGRESQL_ENABLED=true
      - POSTGRESQL_HOSTNAME=kai-db
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_DATABASE=guacamole_db
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./guacamole_config:/etc/guacamole
    depends_on:
      - kai-guacd
      - kai-db
    restart: unless-stopped

  kai-app:
    build: .
    container_name: kai-vchatgpt-app
    command: ["gunicorn", "-b", "0.0.0.0:5000", "--workers", "1", "--threads", "4", "app:app"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@kai-db:5432/${POSTGRES_DB}
    volumes:
      - ./static/scans:/app/static/scans
      - ./static/templates:/app/static/templates
      - ./runtime/backups:/app/backups
    depends_on:
      kai-db:
        condition: service_healthy
      kai-redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kai-vchatgpt-nginx
    ports:
      - "8443:443"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/local:/etc/nginx/ssl:ro
      - ./guacamole_config/branding:/etc/nginx/guac-branding:ro
    depends_on:
      - kai-app
      - kai-guacamole
    restart: unless-stopped
