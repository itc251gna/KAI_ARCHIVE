events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server_tokens off; # Cybersecurity: Απόκρυψη έκδοσης Nginx

    server {
        listen 443 ssl http2;
        
        # ΚΡΙΣΙΜΟ: Μην χρησιμοποιείς "_" αν σκοπεύεις να έχεις hostname. 
        # Αν μπαίνεις με IP, άστο "_", αλλά φρόντισε το URL στον browser 
        # να ΜΗΝ έχει underscores (π.χ. όχι https://kai_system/).
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://kai-app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /guac-branding/ {
            alias /etc/nginx/guac-branding/;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /guacamole {
            return 301 $scheme://$http_host/guacamole/;
        }

	location /guacamole/ {
            proxy_pass http://kai-guacamole:8080/guacamole/;
            
            # 1. ΑΠΕΝΕΡΓΟΠΟΙΗΣΗ BUFFERING (Για να μην κόβεται στα 10 δευτερόλεπτα)
            proxy_buffering off;
            
            # 2. WEBSOCKET HEADERS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade"; # Με κεφαλαίο το Upgrade
            proxy_set_header Accept-Encoding "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header If-None-Match "";
            
            # 3. BYPASS ΤΟΝ ΕΛΕΓΧΟ ΤΟΥ TOMCAT (ΤΟ ΠΙΟ ΚΡΙΣΙΜΟ)
            proxy_set_header Host $host;
            proxy_set_header Origin ""; # Αδειάζουμε το Origin για να μην σπάει το WebSocket
            
            # 4. FORWARDING HEADERS
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port; # Χρήσιμο για τον Tomcat
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;

            # 5. RDP TIMEOUTS
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            keepalive_timeout 86400s;
            sub_filter_once off;
            sub_filter_types application/json;
            sub_filter '</head>' '<link rel="stylesheet" href="/guac-branding/kai-his-branding.css"></head>';
            sub_filter 'Apache Guacamole' 'Σύστημα Υγείας HIS';
            sub_filter '"VERSION":"1.6.0"' '"VERSION":""';
            sub_filter '"ACTION_LOGIN":"Login"' '"ACTION_LOGIN":"Σύνδεση"';
            sub_filter '"FIELD_HEADER_USERNAME":"Username"' '"FIELD_HEADER_USERNAME":"Χρήστης"';
            sub_filter '"FIELD_HEADER_PASSWORD":"Password"' '"FIELD_HEADER_PASSWORD":"Κωδικός"';
            sub_filter '"ERROR_INVALID_LOGIN":"Invalid Login"' '"ERROR_INVALID_LOGIN":"Λάθος στοιχεία σύνδεσης"';
            sub_filter '"DIALOG_HEADER_CONNECTING":"Connecting"' '"DIALOG_HEADER_CONNECTING":"Σύνδεση"';
            sub_filter '"TEXT_CLIENT_STATUS_CONNECTING":"Connecting to Guacamole..."' '"TEXT_CLIENT_STATUS_CONNECTING":"Σύνδεση στο Σύστημα Υγείας HIS..."';
            sub_filter '"TEXT_CLIENT_STATUS_WAITING":"Connected to Guacamole. Waiting for response..."' '"TEXT_CLIENT_STATUS_WAITING":"Σύνδεση στο Σύστημα Υγείας HIS. Αναμονή απόκρισης..."';
        }
    }
    
    # Προαιρετικό αλλά προτεινόμενο: Redirect 80 -> 443
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
