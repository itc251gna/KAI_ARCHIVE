events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://kai-app:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /guac-branding/ {
            alias /etc/nginx/guac-branding/;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /guacamole {
            return 301 $scheme://$http_host/guacamole/;
        }

        location /guacamole/ {
            proxy_pass http://kai-guacamole:8080/guacamole/;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Accept-Encoding "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header If-None-Match "";
            proxy_set_header Host $http_host;
            proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            keepalive_timeout 86400s;
            sub_filter_once off;
            sub_filter_types application/json;
            sub_filter '</head>' '<link rel="stylesheet" href="/guac-branding/kai-his-branding.css"></head>';
            sub_filter 'Apache Guacamole' 'Σύστημα Υγείας HIS';
            sub_filter '"VERSION":"1.6.0"' '"VERSION":""';
            sub_filter '"ACTION_LOGIN":"Login"' '"ACTION_LOGIN":"Σύνδεση"';
            sub_filter '"FIELD_HEADER_USERNAME":"Username"' '"FIELD_HEADER_USERNAME":"Χρήστης"';
            sub_filter '"FIELD_HEADER_PASSWORD":"Password"' '"FIELD_HEADER_PASSWORD":"Κωδικός"';
            sub_filter '"ERROR_INVALID_LOGIN":"Invalid Login"' '"ERROR_INVALID_LOGIN":"Λάθος στοιχεία σύνδεσης"';
            sub_filter '"DIALOG_HEADER_CONNECTING":"Connecting"' '"DIALOG_HEADER_CONNECTING":"Σύνδεση"';
            sub_filter '"TEXT_CLIENT_STATUS_CONNECTING":"Connecting to Guacamole..."' '"TEXT_CLIENT_STATUS_CONNECTING":"Σύνδεση στο Σύστημα Υγείας HIS..."';
            sub_filter '"TEXT_CLIENT_STATUS_WAITING":"Connected to Guacamole. Waiting for response..."' '"TEXT_CLIENT_STATUS_WAITING":"Σύνδεση στο Σύστημα Υγείας HIS. Αναμονή απόκρισης..."';
        }
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$http_host$request_uri;
    }
}
