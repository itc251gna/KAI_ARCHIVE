services:
  kai-db:
    image: postgres:15-alpine
    container_name: kai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  kai-redis:
    image: redis:alpine
    container_name: kai-redis
    restart: always

  kai-guacd:
    image: guacamole/guacd
    container_name: kai-guacd
    restart: always

  kai-guacamole:
    image: guacamole/guacamole
    container_name: kai-guacamole
    environment:
      - GUACD_HOSTNAME=kai-guacd
      - GUACD_PORT=4822
      - GUACAMOLE_HOME=/etc/guacamole
    volumes:
      - ./guacamole_config:/etc/guacamole
    depends_on:
      - kai-guacd
    restart: always

  kai-app:
    build: .
    container_name: kai-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@kai-db:5432/${POSTGRES_DB}
    volumes:
      - ./static/scans:/app/static/scans
      - ./static/templates:/app/static/templates
      - ./backups:/app/backups
    depends_on:
      - kai-db
      - kai-redis
    restart: always

  nginx:
    image: nginx:alpine
    container_name: kai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./guacamole_config/branding:/etc/nginx/guac-branding:ro
    depends_on:
      - kai-app
      - kai-guacamole
    restart: always
